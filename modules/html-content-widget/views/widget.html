{# Widgets created before styleMode existed keep their original inline styling. #}
{% set styleMode = data.widget.styleMode or 'legacy' %}
<div class="article-content article-content--html html-content-widget html-content-widget--{{ styleMode }}" data-html-content-widget>
  {{ apos.htmlContent.sanitize(data.widget.html, styleMode == 'legacy') | safe }}
</div>
